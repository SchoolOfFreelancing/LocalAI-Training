services:
  localai:
    image: localai/localai:latest-aio-cpu
    container_name: localai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - THREADS=4
      - CONTEXT_SIZE=2048
      - API_KEY=${LOCALAI_API_KEY}
    volumes:
      - ./models:/build/models:cached

